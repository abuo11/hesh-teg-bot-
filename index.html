<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Hashtag AI</title>
  <link rel="stylesheet" href="/src/styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo" id="brandLogo"></span>
        <div><div class="brand-name">Hashtag AI</div><div class="brand-sub">Instagram Reels uchun aqlli yordamchi</div></div>
      </div>
      <div class="topbar-actions">
        <span class="chip" id="langChip"></span>
        <span class="avatar" id="avatar"></span>
      </div>
    </header>

    <section class="banner">
      <div class="banner-glow"></div>
      <div class="banner-title">REELS AI STUDIO</div>
      <div class="banner-sub">Trendlarni tahlil qiling. Captionlarni oling. Kontentingizni rivojlantiring.</div>
    </section>

    <main id="page"></main>
  </div>

  <nav class="bottom-nav" id="nav"></nav>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
